<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moin, Zeitreisender</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=UnifrakturMaguntia&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="kopf">
    <h1>Moin, Zeitreisender</h1>
    <nav>
      <button data-panel="notizbuch">Notizbuch</button>
      <button data-panel="woerter">Wörter <span id="wortzahl" class="badge">0</span></button>
      <button data-panel="menue">Menü</button>
    </nav>
  </div>
  <div class="uhr" aria-label="Status">
    <span id="tag">TAG 01</span><span class="sep">│</span><span id="ort"></span><span class="sep">│</span><span id="geld">0 ₰</span><span class="sep">│</span><span id="stufe">STUFE 1</span>
  </div>
</header>

<main id="log" aria-live="polite"></main>
<section id="antworten" class="leer" aria-label="Antworten"><div id="a-vor"></div><div id="a-form"></div><div id="a-nach"></div></section>
<div id="hinweis" class="toast" hidden role="status"></div>

<div id="hilfe" class="popup" hidden role="dialog">
  <div class="popup-kopf"><strong id="hilfe-wort"></strong><button class="zu" aria-label="Schließen">×</button></div>
  <div id="hilfe-text"></div>
</div>

<aside id="panel" hidden>
  <div class="popup-kopf"><strong id="panel-titel"></strong><button class="zu" aria-label="Schließen">×</button></div>
  <div id="panel-inhalt"></div>
</aside>

<input type="file" id="datei" accept="application/json" hidden>
<script src="game_data.js"></script>
<script src="game.js"></script>
</body>
</html>
