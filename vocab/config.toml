# Checker settings. Edit freely.

[player]
# The player starts at A2. Goethe A1 and A2 words are assumed known: they are
# allowed and never counted as "new". The B1 words are what there is to learn.
start_level = "A2"
assumed_known = ["A1", "A2"]

[tiers]
# Day on which each vocabulary tier unlocks. Tier 1 = Goethe A1+A2 (known).
# Tier 2 = the more frequent half of the B1-only words, tier 3 = the rest.
# With A2 as the start, the B1 vocabulary has to be available from day 1.
1 = 1
2 = 1
3 = 11

[stufen]
# Day on which each text level ("Stufe") begins. Level 1 = A2, level 2 = A2+/B1-,
# level 3 = B1. The game also unlocks a level early when the player shows it.
# Lines marked "(stufe >= N)" are checked against the vocabulary of that day.
1 = 1
2 = 11
3 = 21

[budget]
# Soft limits: exceeding them is a warning, never an error.
new_words_per_day = 25
slang_per_day = 3

[recurrence]
# A new word should come back within this many days...
window_days = 3
# ...and reach this many total exposures by the end of the window.
min_exposures = 3

[comprehension]
# Target share of running words the player already knows (i+1: 90-95%).
target_known_share = 0.90

[grammar]
# Day from which each structure is expected. Earlier use is a warning.
praeteritum = 11        # Präteritum of verbs other than sein/haben/modals
konjunktiv2 = 21        # würde/könnte/hätte... ("möchte" is always fine)
relativsatz = 21
